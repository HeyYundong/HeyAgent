:root{
  --stroke:0 0 0 .5px var(--b4);
  --el-panel:0 0 0 .5px var(--b4),0 3px 8px var(--sh-a),0 0 16px var(--sh-b);
  --el-prom:0 0 0 .5px var(--b1),0 3px 8px var(--sh-c),0 0 20px var(--sh-d);
  --el-soft:0 0 0 .5px var(--b2),0 4px 16px var(--sh-a),0 0 24px var(--sh-a);
  --sh-lv2:0 4px 12px var(--sh-b),0 2px 8px var(--sh-c);
  --sh-lv3:0 0 1px var(--sh-f),0 0 4px var(--sh-b),0 12px 32px var(--sh-e);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);color:var(--l1);font:14px/22px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;font-weight:500}
@media (hover:hover){a:hover{text-decoration:underline dotted}}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.ic.s14{width:14px;height:14px}.ic.s12{width:12px;height:12px}.ic.s20{width:20px;height:20px}.ic.s24{width:24px;height:24px}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:999px}::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}::-webkit-scrollbar-track{background:transparent}
@supports (corner-shape:superellipse(1.5)){.se{corner-shape:superellipse(1.5)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--l3)}.cap{color:var(--cap)}.sec{color:var(--l2)}
.okc{color:var(--ok-label)}.errc{color:var(--err)}.warnc{color:var(--warn-label)}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hr{height:.5px;background:var(--b2);border:0;margin:0}

/* ===== frame ===== */
.frame{position:relative;height:100%;display:grid;grid-template-columns:var(--sbw,280px) minmax(0,1fr) var(--rbw,0px);transition:grid-template-columns .3s var(--ease);background:var(--bg-base);overflow:hidden}
.frame.noanim{transition:none}
.sbcol{background:var(--sidebar-fill);border-right:.5px solid var(--b3);min-width:0;overflow:hidden;position:relative;z-index:2}
.center{min-width:0;position:relative;display:flex;flex-direction:column;overflow:hidden;grid-column:2;grid-row:1}
.sbcol{grid-column:1;grid-row:1}.rbcol{grid-column:3;grid-row:1}
.rbcol{min-width:0;overflow:hidden;border-left:.5px solid var(--b4);background:var(--bg-base);position:relative}
.mask{position:absolute;inset:0;background:var(--mask);z-index:70;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:767px){
  .frame{grid-template-columns:0 minmax(0,1fr) 0 !important}
  .sbcol{position:absolute;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:71;transform:translateX(-100%);transition:transform .3s var(--ease);border-right:.5px solid var(--b3)}
  .frame.drawer .sbcol{transform:none}
  .rbcol{position:absolute;inset:0;z-index:60;border-left:0;display:none}
  .frame.rbopen .rbcol{display:block}
}

/* ===== sidebar ===== */
.sb{display:flex;flex-direction:column;height:100%;padding:6px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));font-size:14px;color:var(--l1);width:var(--sbw-in,280px);min-width:0}
@media (max-width:767px){.sb{width:100%}}
.logo-row{height:60px;flex:none;display:flex;align-items:center;gap:8px;padding:8px 0 8px 8px}
.brand{flex:1;display:flex;align-items:center;gap:5px;height:24px;min-width:0}
.brand img{width:24px;height:24px;border-radius:6px;flex:none}
.brand b{font:600 18px/24px var(--font);letter-spacing:.04em;white-space:nowrap}
.ibtn{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--l2);flex:none;position:relative}
@media (hover:hover){.ibtn:hover{background:var(--hover)}}
.ibtn.on{background:var(--hover);color:var(--l1)}
.ibtn:disabled{opacity:.4}
.newbtn{height:38px;flex:none;margin:0 4px;padding:8px 12px;border:.5px solid var(--b3);border-radius:12px;background:var(--elevated);font:500 14px/22px var(--font);display:flex;align-items:center;justify-content:center;gap:6px;position:relative}
@media (hover:hover){.newbtn:hover{background:var(--float-hover)}}
.newbtn .kbd{position:absolute;right:12px;color:var(--cap);font-size:12px;opacity:0;transition:opacity .1s}
.newbtn:hover .kbd,.newbtn:focus-visible .kbd{opacity:1}
.sbscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin-top:4px;position:relative;scrollbar-width:none;padding-bottom:24px}
.sbscroll:hover{scrollbar-width:thin}
.sbscroll::-webkit-scrollbar{width:0}.sbscroll:hover::-webkit-scrollbar{width:5px}
.plist{display:flex;flex-direction:column;gap:2px;margin:6px 0 8px}
.prow{min-height:32px;padding:5px 9px;border-radius:12px;display:flex;align-items:center;gap:6px;line-height:22px;width:100%;color:var(--l1);position:relative}
@media (hover:hover){.prow:hover{background:var(--hover)}}
.prow.on{background:var(--hover)}
.prow .ic{color:var(--l2)}
.prow .badge{margin-left:auto}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;font:500 11px/18px var(--font);text-align:center;font-variant-numeric:tabular-nums}
.badge.warn{background:var(--warn);color:#FFFFFF}
.badge.grey{color:var(--l3);background:transparent;padding:0}
.badge.blue{background:var(--accent);color:var(--on-primary)}
.sbhead{height:36px;display:flex;align-items:center;padding-left:12px;gap:4px;color:var(--l3)}
.sbhead .t{flex:1;font-size:14px}
.sbsearch{margin:0 4px 6px;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:.5px solid var(--b4);border-radius:12px;background:var(--layer1)}
.sbsearch:focus-within{border-color:var(--accent)}
.sbsearch input{border:0;background:none;flex:1;min-width:0;font-size:13px}
.sbsearch input::placeholder{color:var(--cap)}
.grp{height:32px;border-radius:12px;display:flex;align-items:center;gap:6px;padding:0 6px 0 9px;width:100%;position:relative;color:var(--l1)}
@media (hover:hover){.grp:hover{background:var(--hover)}}
.grp .gi{width:16px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--l2);flex:none}
.grp .gi .chev{display:none;transition:transform .15s}
.grp.open .gi .chev{transform:rotate(90deg)}
@media (hover:hover){.grp:hover .gi .fold{display:none}.grp:hover .gi .chev{display:block}}
.grp.cur .gi .fold{color:var(--accent)}
.grp .nm{font-size:14px;line-height:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gact{display:none;gap:2px}
@media (hover:hover){.grp:hover .gact{display:flex}.grp:hover .gcount{display:none}}
.grp .gact .ibtn{width:22px;height:22px;border-radius:6px}
.gcount{font-size:10px;line-height:16px;color:var(--cap)}
.rrow{height:32px;border-radius:12px;display:flex;align-items:center;gap:6px;padding:0 8px 0 9px;padding-inline-start:31px;width:100%;position:relative;color:var(--l1)}
@media (hover:hover){.rrow:hover{background:var(--hover)}.rrow:hover .rtime{display:none}.rrow:hover .ract{display:flex}}
.rrow.on{background:var(--hover)}
.rrow.flat{padding-inline-start:9px}
.rrow .st{width:16px;height:20px;display:flex;align-items:center;justify-content:center;flex:none;margin-left:-22px}
.rrow.flat .st{margin-left:0}
.rrow .tt{flex:1;min-width:0;font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rid{font-size:11px;color:var(--cap);margin-left:4px;font-variant-numeric:tabular-nums}
.rtime{font-size:10px;line-height:16px;color:var(--l3);flex:none;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.rtime.warn{color:var(--warn-label);font-weight:500}
.ract{display:none;gap:2px}
.ract .ibtn{width:22px;height:22px;border-radius:6px}
.more-line{height:28px;padding-left:31px;font-size:12px;color:var(--l3);display:flex;align-items:center;width:100%;border-radius:12px}
@media (hover:hover){.more-line:hover{color:var(--l1)}}
.sbfade{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,var(--sidebar-fill));pointer-events:none}
.sbfoot{flex:none;display:flex;align-items:center;gap:4px;padding-top:4px;position:relative}
.acct{flex:1;min-width:0;height:44px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 8px}
@media (hover:hover){.acct:hover{background:var(--hover)}}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--module);color:var(--l2);display:inline-flex;align-items:center;justify-content:center;font:500 12px/1 var(--font);flex:none}
.avatar.lg{width:36px;height:36px;font-size:14px}
.acct .who{min-width:0;display:flex;flex-direction:column;line-height:18px}
.acct .who small{font-size:11px;color:var(--l3);line-height:14px}
/* rail */
.sb.rail{padding:18px 10px 6px;align-items:center;width:56px}
.sb.rail .railbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--l2);position:relative;flex:none}
@media (hover:hover){.sb.rail .railbtn:hover{background:var(--hover)}}
.sb.rail .railbtn.on{background:var(--hover);color:var(--l1)}
.sb.rail .railstack{display:flex;flex-direction:column;gap:12px;align-items:center;animation:railin .15s var(--ease)}
@keyframes railin{from{transform:translateX(49px);opacity:0}to{transform:none;opacity:1}}
.sb.rail .dotb{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.brandmark{position:relative}
.brandmark .exp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--sidebar-fill)}
@media (hover:hover){.brandmark:hover .exp{display:flex}}

/* status glyphs */
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.sdot.warn{background:var(--warn)}.sdot.ok{background:var(--ok)}.sdot.err{background:var(--err)}.sdot.idle{background:var(--idle)}.sdot.blue{background:var(--accent)}
.spin{width:14px;height:14px;flex:none;animation:rot 1.5s linear infinite;color:var(--l3)}
.spin circle{fill:none;stroke:currentColor;stroke-width:2}
.spin .trk{opacity:.25}
.spin .arc{stroke-dasharray:14 40;stroke-linecap:round}
@keyframes rot{to{transform:rotate(360deg)}}
.shimmer{background:linear-gradient(90deg,currentColor 0%,currentColor 40%,var(--shimmer-hi) 50%,currentColor 60%,currentColor 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}

/* ===== buttons, tags, inputs ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 14px;border-radius:12px;font:400 14px/22px var(--font);white-space:nowrap;flex:none;transition:background .1s}
.btn .ic{margin-left:-2px}
.btn.sm{height:28px;border-radius:8px;font-size:12px;line-height:18px;padding:0 10px}
.btn.pill{border-radius:16px;height:32px;font-size:13px;line-height:20px}
.btn.primary{background:var(--btn);color:var(--on-primary)}
@media (hover:hover){.btn.primary:hover{background:var(--btn-hover)}}
.btn.info{background:var(--info);color:#FFFFFF}
.btn.ghost{background:transparent}
@media (hover:hover){.btn.ghost:hover,.btn.outline:hover{background:var(--hover)}}
.btn.ghost:active,.btn.outline:active{background:var(--active)}
.btn.outline{box-shadow:inset 0 0 0 .5px var(--b3)}
.btn.danger{color:var(--err)}
@media (hover:hover){.btn.danger:hover{background:var(--hover-danger)}}
.btn.dangerfill{background:var(--err);color:#FFFFFF}
.btn:disabled{opacity:.4}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:1px 8px;border-radius:999px;font:500 11px/17px var(--font);white-space:nowrap;flex:none;box-shadow:inset 0 0 0 .5px var(--b4);color:var(--l3)}
.tag.neutral{box-shadow:none;background:var(--module);color:var(--l2)}
.tag.solid{box-shadow:none;background:var(--btn);color:var(--on-primary)}
.tag.ok{box-shadow:none;background:var(--ok-soft);color:var(--ok-label)}
.tag.err{box-shadow:none;background:var(--err-soft);color:var(--err)}
.tag.warn{box-shadow:none;background:var(--warn-soft);color:var(--warn-label)}
.tag.info{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
.tag.violet{box-shadow:none;background:var(--violet-soft);color:var(--violet)}
.tag .ic{width:12px;height:12px}
.tag.lg{height:24px;font-size:12px;padding:0 9px}
.sqtag{display:inline-flex;align-items:center;padding:0 6px;height:18px;border-radius:4px;font:400 11px/16px var(--font);box-shadow:inset 0 0 0 .5px var(--b3);color:var(--l3);white-space:nowrap}
.tbd{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:4px;border:1px dashed var(--warn);color:var(--warn-label);font:500 11px/16px var(--font);white-space:nowrap;cursor:help;flex:none;vertical-align:middle}
.inp{height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border:.5px solid var(--b4);border-radius:12px;background:var(--layer1);min-width:0}
.inp:focus-within{border-color:var(--accent)}
.inp input{border:0;background:none;flex:1;min-width:0;height:100%;font-size:14px}
.inp input::placeholder,.field textarea::placeholder,.field input::placeholder{color:var(--cap)}
.inp .ic{color:var(--l3)}
.inp.lg{height:36px;padding:0 10px;border-color:var(--b3)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field .lbl{font:500 13px/20px var(--font);color:var(--l1);display:flex;align-items:center;gap:6px}
.field .hint{font-size:12px;line-height:18px;color:var(--l3)}
.field .errt{font-size:12px;line-height:18px;color:var(--err)}
.txt,.sel{height:34px;padding:0 12px;border:.5px solid var(--b4);border-radius:12px;background:var(--layer3);font-size:13px;width:100%;min-width:0}
.txt:focus,.sel:focus,.ta:focus{border-color:var(--accent)}
.ta{padding:8px 12px;border:.5px solid var(--b4);border-radius:12px;background:var(--layer3);font-size:13px;line-height:20px;width:100%;resize:vertical;min-height:64px}
.sel{appearance:none;background-image:none;padding-right:28px;cursor:pointer}
.selwrap{position:relative;display:block;min-width:0}
.selwrap .ic{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--cap);width:14px;height:14px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;line-height:20px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--btn);margin:0}
.switch{width:36px;height:20px;border-radius:999px;padding:2px;background:var(--b3);display:inline-flex;flex:none;transition:background .12s;position:relative}
.switch::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--switch-thumb);transition:transform .12s;box-shadow:0 1px 2px var(--sh-c)}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg-base)}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:12px;background:var(--hover);flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:28px;padding:0 14px;border-radius:8px;font:500 13px/20px var(--font);color:var(--l2);white-space:nowrap}
.seg button.on{background:var(--layer1);color:var(--l1);box-shadow:var(--el-soft)}
.segt{display:inline-flex;padding:4px;border-radius:16px;background:var(--module);max-width:100%;overflow-x:auto;scrollbar-width:none}
.segt button{height:30px;padding:0 14px;border-radius:12px;font-size:14px;line-height:20px;color:var(--l2);white-space:nowrap}
.segt button.on{background:var(--layer3);box-shadow:inset 0 0 0 .5px var(--b3);color:var(--l1);font-weight:600}
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ftabs button{height:28px;padding:0 10px;border-radius:14px;color:var(--l3);font-size:14px;line-height:22px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
@media (hover:hover){.ftabs button:hover{color:var(--l1)}}
.ftabs button.on{background:var(--hover);color:var(--l1)}
.ftabs .n{font-size:11px;color:var(--l3);font-variant-numeric:tabular-nums}
.utabs{display:flex;gap:24px;border-bottom:.5px solid var(--b3);overflow-x:auto;scrollbar-width:none}
.utabs button{height:36px;font:500 13px/16px var(--font);color:var(--l3);position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.utabs button.on{color:var(--accent)}
.utabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;background:var(--accent);border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;line-height:20px}
.kv dt{color:var(--l3);white-space:nowrap}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.card{border-radius:20px;border:.5px solid var(--b4);background:var(--layer2);padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--layer1)}
.card h4{margin:0;font:500 14px/22px var(--font)}
.addtile{width:100%;min-height:56px;border:1px dashed var(--b3);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--l1)}
@media (hover:hover){.addtile:hover{border-color:var(--accent);color:var(--accent)}}
.dashed-empty{border:1px dashed var(--b4);border-radius:16px;padding:20px;text-align:center;color:var(--l3);font-size:13px}
.empty{padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--l3);text-align:center;font-size:14px}
.empty .ic{width:28px;height:28px;color:var(--cap)}
.skel{background:var(--skeleton);border-radius:8px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.prog{height:4px;border-radius:999px;background:var(--hover);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.ring{width:16px;height:16px;flex:none}
.ring circle{fill:none;stroke-width:2.2}
.ring .bg{stroke:var(--b3)}.ring .fg{stroke:var(--l3);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}

/* ===== menus, tooltip, modal, toast ===== */
.layer{position:fixed;inset:0;pointer-events:none;z-index:1100}
.layer>*{pointer-events:auto}
.menu{position:fixed;min-width:144px;max-width:360px;padding:4px;border-radius:16px;background:var(--menu-fill);-webkit-backdrop-filter:blur(40px) saturate(150%);backdrop-filter:blur(40px) saturate(150%);box-shadow:var(--el-prom);animation:fade .12s var(--ease);max-height:min(460px,80vh);overflow-y:auto;font-size:13px;line-height:20px}
.mi{min-height:34px;padding:6px 8px;border-radius:12px;display:flex;align-items:center;gap:6px;width:100%;color:var(--l1)}
@media (hover:hover){.mi:hover{background:var(--hover)}}
.mi:focus-visible{background:var(--hover);outline:none}
.mi .ic{width:14px;height:14px;color:var(--l2)}
.mi .end{margin-left:auto;color:var(--l3);font-size:11px;display:flex;align-items:center;gap:4px}
.mi.danger{color:var(--err)}.mi.danger .ic{color:var(--err)}
@media (hover:hover){.mi.danger:hover{background:var(--hover-danger)}}
.mi:disabled{opacity:.4}
.mi .sub{display:block;font-size:11px;line-height:15px;color:var(--l3)}
.mlabel{font-size:11px;line-height:15px;color:var(--l3);padding:6px 8px}
.msep{height:.5px;background:var(--b2);margin:3px 8px}
.msearch{margin:2px 2px 4px;height:32px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:12px;background:var(--hover)}
.msearch input{border:0;background:none;flex:1;min-width:0;font-size:13px}
.tooltip{position:fixed;z-index:1200;padding:3px 7px;border-radius:8px;background:var(--tip-bg);color:var(--tip-fg);font-size:13px;line-height:20px;max-width:min(320px,80vw);pointer-events:none;animation:fade .15s var(--ease)}
.modal-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.modal-wrap>.mask{position:absolute;inset:0;z-index:0}
.modal{position:relative;z-index:1;width:min(420px,100%);max-height:100%;display:flex;flex-direction:column;gap:16px;padding-bottom:24px;border-radius:28px;background:var(--layer2);box-shadow:var(--el-prom);animation:pop .2s var(--ease);overflow:hidden}
.modal.wide{width:min(720px,100%)}.modal.xwide{width:min(1040px,100%)}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:8px;padding:22px 14px 0 24px}
.mhead h3{margin:0;flex:1;font:500 16px/24px var(--font);display:flex;align-items:center;gap:8px;min-width:0}
.mhead h3 .ic{color:var(--warn)}
.mbody{padding:0 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0}
.mfoot{padding:0 24px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.mfoot .btn{min-width:72px}
.toasts{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:1150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;padding:12px 16px;border-radius:16px;background:var(--toast-bg);color:var(--toast-fg);font-size:14px;line-height:22px;box-shadow:var(--sh-lv3);display:flex;align-items:center;gap:8px;animation:toastin .16s var(--ease)}
.toast.out{opacity:0;transition:opacity 1s}
.toast .ic.okc{color:var(--ok)}.toast .ic.warnc{color:var(--warn)}
.toast button{color:var(--toast-link);font-weight:500}
@keyframes toastin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ===== conversation ===== */
.chead{flex:none;display:grid;grid-template-rows:auto auto;padding:10px 20px 0 20px;padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:.5px solid var(--b3);min-height:40px}
.chead.bare{border-bottom:0;min-height:40px;padding-bottom:0}
.trow{min-height:30px;display:flex;align-items:center;gap:8px;min-width:0}
.crumbs{display:flex;align-items:center;min-width:0;flex:0 0 auto;max-width:60%}
.crumb{padding:4px 8px;border-radius:12px;font-size:14px;line-height:20px;color:var(--l3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover){button.crumb:hover{background:var(--hover);color:var(--l1)}}
.crumb.cur{color:var(--l1);font-weight:500}
.crumb-sep{color:var(--cap)}
.hacts{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto;overflow:hidden}
.hutil{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
.hbtn{height:28px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;font:500 13px/20px var(--font);color:var(--l2);white-space:nowrap}
@media (hover:hover){.hbtn:hover{background:var(--hover);color:var(--l1)}}
.hbtn.on{background:var(--hover);color:var(--l1)}
.hbtn .n{font-variant-numeric:tabular-nums}
.vtabs{display:flex;gap:32px;padding-left:8px;margin-top:10px;align-items:flex-end}
.vtabs button{font:500 13px/16px var(--font);color:var(--l3);padding-bottom:10px;position:relative}
.vtabs button.on{color:var(--accent)}
.vtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;background:var(--accent);border-radius:2px}
.lineage{font-size:12px;color:var(--l3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.lineage button{color:var(--link);font-weight:500}
.convbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.txs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}
.tx{width:min(100%,clamp(680px,64%,920px));margin:0 auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:4px}
.seat{flex:none;position:relative;z-index:9;padding:0 16px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.seat::before{content:"";position:absolute;left:0;right:0;top:-36px;height:36px;background:linear-gradient(transparent,var(--bg-base));pointer-events:none}
.seat-in{width:min(100%,calc(clamp(680px,64%,920px) + 0px));margin:0 auto;display:flex;flex-direction:column;gap:8px}
.tobottom{position:absolute;left:50%;transform:translateX(-50%);top:-50px;width:34px;height:34px;border-radius:50%;background:var(--float);box-shadow:var(--el-prom);display:flex;align-items:center;justify-content:center;color:var(--l2)}
/* user bubble */
.ubwrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin:4px 0 12px}
.ubub{background:var(--bubble);border-radius:20px;padding:10px 16px;font-size:14px;line-height:22px;white-space:pre-wrap;max-width:min(70.2%,82%);overflow-wrap:anywhere}
.ubub.pending{opacity:.5}
.ublabel{font-size:12px;line-height:18px;color:var(--l3);display:flex;align-items:center;gap:4px}
.filecard{width:240px;max-width:100%;height:64px;border-radius:16px;border:.5px solid var(--b2);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--layer1);text-align:left}
.ftile{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--module);color:var(--l2);font:600 10px/1 var(--font)}
.ftile.xlsx{background:var(--ok-soft);color:var(--ok-label)}.ftile.png{background:var(--accent-soft);color:var(--accent)}.ftile.pdf{background:var(--err-soft);color:var(--err)}.ftile.md{background:var(--violet-soft);color:var(--violet)}
.filecard .fn{font-size:13px;line-height:20px}.filecard .fs{font-size:12px;color:var(--l3)}
/* assistant text */
.atext{font-size:14px;line-height:24px;color:var(--l1);overflow-wrap:anywhere;margin:4px 0}
.atext p{margin:0 0 12px}.atext p:last-child{margin:0}
.atext ul,.atext ol{margin:0 0 12px;padding-left:22px}
.atext code{font-family:var(--mono);font-size:12px;line-height:19px;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.atext strong{font-weight:600}
.atext table{border-collapse:collapse;font-size:13px;line-height:22px;margin:4px 0 12px}
.atext th{font-weight:500;text-align:left}
.atext th,.atext td{border-bottom:.5px solid var(--b2);padding:4px 16px 4px 0}
/* disclosure / tool rows */
.disc{min-height:24px;display:flex;align-items:center;gap:0;color:var(--l3);font-size:13px;line-height:24px;width:100%;min-width:0;text-align:left}
@media (hover:hover){.disc:hover{color:var(--l2)}}
.disc .lead{width:16px;height:16px;margin-right:6px;position:relative;flex:none;display:inline-flex}
.disc .lead .ic{position:absolute;inset:0}
.disc .lead .chev{opacity:0;transition:transform .15s}
@media (hover:hover){.disc:hover .lead .tic{opacity:0}.disc:hover .lead .chev{opacity:1}}
.disc.open .lead .chev{transform:rotate(90deg)}
.disc .ttl{white-space:nowrap;flex:none}
.disc .dsep{width:2px;height:2px;border-radius:50%;background:var(--cap);margin:0 8px;flex:none}
.disc .sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.disc .sum u{text-decoration:underline dotted;text-underline-offset:3px}
.disc .tail{margin-left:8px;display:inline-flex;align-items:center;gap:6px;flex:none}
.disc.running .ttl,.disc.running .sum{color:var(--l3)}
.disc.running .ttl{background:linear-gradient(90deg,var(--l3) 0%,var(--l3) 40%,var(--l1) 50%,var(--l3) 60%,var(--l3) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shim 1.8s linear infinite}
.disc.err .sum{color:var(--err)}
.disc.warnst .sum{color:var(--warn-label)}
.dstat{font-family:var(--mono);font-size:11px}
.dstat .a{color:var(--ok-label)}.dstat .d{color:var(--err)}
.dbody{padding:4px 0 6px 22px;color:var(--l3);font-size:13px;line-height:22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dbody.think{white-space:pre-wrap}
.io{border-radius:16px;background:var(--code-bg);border:.5px solid var(--b1);font:11px/16px var(--mono);display:grid;grid-template-columns:auto 1fr;min-width:0;overflow:hidden}
.io .k{color:var(--cap);padding:8px 10px 8px 12px;border-top:.5px solid var(--b1)}
.io .v{padding:8px 12px 8px 0;color:var(--l2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:150px;overflow-y:auto;border-top:.5px solid var(--b1)}
.io .k:first-child,.io .k:first-child+.v{border-top:0}
.exitpill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;background:var(--module);font-size:11px;color:var(--l2)}
.thumb{width:56px;height:34px;border-radius:6px;border:.5px solid var(--b2);overflow:hidden;flex:none;background:var(--web-bg);position:relative}
.thumb .tb{position:absolute;left:0;right:0;top:0;height:6px;background:var(--web-brand)}
.thumb .tl{position:absolute;left:4px;right:4px;height:3px;background:var(--web-line);border-radius:2px}
.agentdo{font-size:11px;color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.cp{display:flex;align-items:center;gap:6px;font-size:13px;line-height:24px;color:var(--l2);min-height:24px}
.cp .ic{color:var(--ok)}
.cp.skip .ic{color:var(--cap)}
.cp b{font-weight:500;color:var(--l1)}
.marker{display:flex;align-items:center;gap:10px;color:var(--l3);font-size:12px;line-height:18px;margin:14px 0}
.marker::before,.marker::after{content:"";flex:1;height:.5px;background:var(--b2)}
.marker span{display:inline-flex;align-items:center;gap:5px;max-width:80%;text-align:center}
.marker.warn span{color:var(--warn-label)}
.rulehit{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn-label);background:var(--warn-soft);border-radius:8px;padding:2px 8px;align-self:flex-start;margin:2px 0}

}

A.tourToggle = () => { S.tour.open = !S.tour.open; save(); render(); };
A.tourClose = () => { S.tour.open = false; save(); render(); };
A.tourGo = t => { const g = +t.dataset.g, i = +t.dataset.i; S.tour.done[g + '-' + i] = true; save(); S.settings = null; S.modal = null; S.coach = null; S.ass.open = false; S.loggedIn = S.loggedIn || TOUR[g].items[i][0] !== '登录页'; if (S.view === 'login') S.loggedIn = true; S.tour.open = false; TOUR[g].items[i][2](); };

/* ================= drag & drop, files ================= */
let dragDepth = 0;
window.addEventListener('dragenter', e => { if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return; dragDepth++; if (!S.drag && (S.view === 'gallery' || S.view === 'home' || S.view === 'run')) { S.drag = true; render(); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth && S.drag) { S.drag = false; render(); } });
window.addEventListener('dragover', e => { if (S.drag) e.preventDefault(); });
window.addEventListener('drop', e => { if (!S.drag) return; e.preventDefault(); dragDepth = 0; S.drag = false; const files = Array.from(e.dataTransfer.files || []); handleFiles(files, S.view === 'gallery' ? 'gallery' : S.view === 'run' ? 'run' : 'hero'); });
document.addEventListener('paste', e => { if (S.view !== 'gallery') return; const f = Array.from(e.clipboardData.files || []); if (f.length) handleFiles(f, 'gallery'); });
$('#filepick').addEventListener('change', e => { handleFiles(Array.from(e.target.files || []), S.pickFor); e.target.value = ''; });
function handleFiles(files, where) {
  if (!files.length) { render(); return; }
  if (where === 'gallery') { files.forEach(f => fakeUpload(f.name)); return; }
  const list = where === 'run' ? (curRun().draftAtts = curRun().draftAtts || []) : S.hero.atts;
  files.forEach(f => addAttachment(list, f.name, Math.max(1, Math.round(f.size / 1024)) + ' KB'));
  render();
}

/* ================= boot ================= */
(function boot() {
  load();
  if (vw() < 768) S.tour.open = false;
  seedRuns(); RUNS.forEach(initRun);
  if (vw() >= 768 && vw() < 1024) S.sb.collapsed = true;
  route();
  setInterval(tickEngine, 250);
  setInterval(tickStream, 40);
  setInterval(tickClock, 1000);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
