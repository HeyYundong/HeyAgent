# 桌面服务（docs/dev/desktop.md 第 6 节）。和 Windows-MCP 0.8.8 装在同一个 Python 3.14 里，
# 只用 Windows-MCP 已经带进来的包；下面的版本是 2026-10-22 在验证用的虚拟机上 `pip install windows-mcp==0.8.8` 装出来的版本。
[build-system]
requires = ["flit_core==4.1.0"]
build-backend = "flit_core.buildapi"

[project]
name = "heyagent-desktop-agent"
version = "0.1.0"
description = "HeyAgent 桌面服务：推画面、回传键鼠、截图、传文件"
requires-python = ">=3.14,<3.15"
dependencies = [
  "windows-mcp==0.8.8",
  "starlette==1.9.0",
  "uvicorn==0.54.0",
  "websockets==17.3",
  "pillow==13.0.0",
]

