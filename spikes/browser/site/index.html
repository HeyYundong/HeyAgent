<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HeyAgent 远程画面测试页</title>
<style>
  body { font-family: sans-serif; margin: 24px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  section { border: 1px solid #ccc; padding: 12px 16px; margin: 12px 0; background: #fff; }
  #track { position: relative; width: 400px; height: 40px; background: #e5e5e5; user-select: none; }
  #knob { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: #c33; cursor: grab; }
  #fill { position: absolute; left: 0; top: 0; height: 40px; width: 0; background: #f2b8b8; }
  #hover { width: 120px; height: 40px; background: #ddd; display: inline-block; vertical-align: middle; }
  #hover:hover { background: #3a3; }
  input[type=text] { width: 360px; font-size: 16px; padding: 4px; }
  .tall { height: 1600px; background: linear-gradient(#fff, #ddd); }
  #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
</style>
</head>
<body>
<h1>远程画面测试页：中文字形 汉字 繁體 日本語 한국어 😀🎉</h1>
<p>这一页给远程画面实测用：输入框、拖动滑块、开新标签的链接、弹 alert / confirm / prompt 的按钮。只在本地打开。</p>

<section>
  <label>输入框：<input id="text" type="text" placeholder="点这里，试试中文输入法和粘贴"></label>
  <div>当前值：<span id="textValue"></span></div>
</section>

<section>
  <div>拖动滑块（按住红块拖到最右边）：</div>
  <div id="track"><div id="fill"></div><div id="knob"></div></div>
  <div>状态：<span id="sliderState">未开始</span></div>
  <div style="margin-top:8px">原生滑块：<input id="range" type="range" min="0" max="100" value="0"> <span id="rangeValue">0</span></div>
</section>

<section>
  <a id="newTabLink" href="/newtab.html" target="_blank">在新标签页打开（target=_blank）</a>
  &nbsp; <button id="openWin">window.open 打开</button>
</section>

<section>
  <button id="alertBtn">弹 alert</button>
  <button id="confirmBtn">弹 confirm</button>
  <button id="promptBtn">弹 prompt</button>
  <div>弹框结果：<span id="dialogResult">无</span></div>
</section>

<section>
  <span id="hover">鼠标悬停变绿</span>
  <button id="clickBtn">点我计数</button> <span id="clicks">0</span>
  <div>最近按键：<span id="lastKey">无</span></div>
</section>

<section><div>事件日志：</div><div id="log"></div></section>
<div class="tall">长内容，用来测滚轮。</div>
<div id="bottom">页面底部</div>

<script>
  const $ = (id) => document.getElementById(id)
  const log = (s) => { const el = $("log"); el.textContent = (s + "\n" + el.textContent).slice(0, 4000) }
  window.__events = []
  const rec = (e) => window.__events.push(e)

  $("text").addEventListener("input", (e) => { $("textValue").textContent = e.target.value })
  $("text").addEventListener("compositionend", (e) => log("compositionend " + e.data))

  // 自写的拖动滑块：和常见滑块验证码一样，只认 mousedown → 连续 mousemove → mouseup
  const knob = $("knob"), track = $("track"), fill = $("fill")
  let drag = null
  window.__slider = { moves: 0, done: false, maxX: 0 }
  knob.addEventListener("mousedown", (e) => { drag = { x0: e.clientX, left0: knob.offsetLeft }; window.__slider.moves = 0; $("sliderState").textContent = "拖动中"; rec("slider-down") })
  window.addEventListener("mousemove", (e) => {
    if (!drag) return
    const max = track.clientWidth - knob.clientWidth
    const x = Math.max(0, Math.min(max, drag.left0 + e.clientX - drag.x0))
    knob.style.left = x + "px"; fill.style.width = x + "px"
    window.__slider.moves++; window.__slider.maxX = Math.max(window.__slider.maxX, x)
  })
  window.addEventListener("mouseup", () => {
    if (!drag) return
    const max = track.clientWidth - knob.clientWidth
    const ok = knob.offsetLeft >= max - 2
    window.__slider.done = ok
    $("sliderState").textContent = ok ? `通过（${window.__slider.moves} 次 mousemove）` : "没拖到头"
    rec("slider-up " + (ok ? "ok" : "fail")); drag = null
  })
  $("range").addEventListener("input", (e) => { $("rangeValue").textContent = e.target.value })

  $("openWin").addEventListener("click", () => window.open("/newtab.html?from=window.open", "_blank"))
  $("alertBtn").addEventListener("click", () => { alert("这是 alert：你好"); $("dialogResult").textContent = "alert 已关闭"; rec("alert-closed") })
  $("confirmBtn").addEventListener("click", () => { const r = confirm("确定要继续吗？"); $("dialogResult").textContent = "confirm=" + r; rec("confirm " + r) })
  $("promptBtn").addEventListener("click", () => { const r = prompt("请输入备注", "默认值"); $("dialogResult").textContent = "prompt=" + r; rec("prompt " + r) })

  let clicks = 0
  $("clickBtn").addEventListener("click", () => { $("clicks").textContent = ++clicks; rec("click") })
  window.addEventListener("keydown", (e) => { $("lastKey").textContent = `${e.key} (${e.code})${e.ctrlKey ? " +Ctrl" : ""}${e.shiftKey ? " +Shift" : ""}`; rec("keydown " + e.key) })
  window.addEventListener("wheel", () => rec("wheel"), { passive: true })
</script>
</body>
</html>
